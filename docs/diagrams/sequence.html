<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSHInjector VPN 连接时序</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f5f5;--paper-2:#ececec;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--rule:rgba(45,49,66,0.12);--rule-solid:#bfc0c0;--accent:#eb6c36;--accent-tint:rgba(235,108,54,0.08);--link:#2e5aa8}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Geist',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;padding:2rem}header{margin-bottom:2rem}header .eyebrow{font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem}h1{font-family:'Instrument Serif',serif;font-size:1.75rem;font-weight:400;color:var(--ink)}.diagram-container{background:var(--paper);overflow-x:auto}svg{display:block}footer{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--rule);font-family:'Geist Mono',monospace;font-size:10px;color:var(--soft);text-align:center}
.actor{font-family:'Geist',sans-serif;font-size:11px;font-weight:600}.actor .type{font-family:'Geist Mono',monospace;font-size:7px;fill:var(--muted);letter-spacing:0.08em}.msg-label{font-family:'Geist Mono',monospace;font-size:8px;fill:var(--ink);letter-spacing:0.06em}.async-label{font-family:'Geist Mono',monospace;font-size:8px;fill:var(--link);letter-spacing:0.06em}.return-label{font-family:'Geist Mono',monospace;font-size:8px;fill:var(--muted);letter-spacing:0.06em}.note-text{font-family:'Instrument Serif',serif;font-size:12px;font-style:italic;fill:var(--soft)}marker{overflow:visible}
</style>
</head>
<body>
<header>
<p class="eyebrow">Sequence Diagram</p>
<h1>VPN 连接建立时序</h1>
</header>
<div class="diagram-container">
<svg width="1000" height="880" viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VPN 连接建立时序图">
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink)"/></marker>
<marker id="arrow-async" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
<marker id="arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
</defs>
<rect width="100%" height="100%" fill="var(--paper)"/>

<!-- Actors: Lifelines -->
<!-- User -->
<g class="actor">
<line x1="80" y1="40" x2="80" y2="820" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="40" y="20" width="80" height="32" rx="4" fill="var(--ink)"/>
<text x="80" y="42" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户</text>
<text x="80" y="56" class="type">ACTOR</text>
</g>

<!-- MainActivity -->
<g class="actor">
<line x1="200" y1="40" x2="200" y2="820" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="160" y="20" width="80" height="32" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
<text x="200" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MainActivity</text>
<text x="200" y="56" class="type">UI</text>
</g>

<!-- MainViewModel -->
<g class="actor">
<line x1="320" y1="40" x2="320" y2="820" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="280" y="20" width="80" height="32" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
<text x="320" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MainViewModel</text>
<text x="320" y="56" class="type">VIEWMODEL</text>
</g>

<!-- SshVpnService -->
<g class="actor">
<line x1="440" y1="40" x2="440" y2="820" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="400" y="20" width="80" height="32" rx="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
<text x="440" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SshVpnService</text>
<text x="440" y="56" class="type" fill="var(--accent)">FOREGROUND</text>
</g>

<!-- VpnController -->
<g class="actor">
<line x1="560" y1="40" x2="560" y2="820" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="520" y="20" width="80" height="32" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
<text x="560" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VpnController</text>
<text x="560" y="56" class="type">USECASE</text>
</g>

<!-- JschSshClient -->
<g class="actor">
<line x1="680" y1="40" x2="680" y2="820" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="640" y="20" width="80" height="32" rx="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
<text x="680" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JschSshClient</text>
<text x="680" y="56" class="type" fill="var(--accent)">DATA</text>
</g>

<!-- Socks5ProxyServer -->
<g class="actor">
<line x1="800" y1="40" x2="800" y2="820" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="760" y="20" width="80" height="32" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
<text x="800" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Socks5Proxy</text>
<text x="800" y="56" class="type">DOMAIN</text>
</g>

<!-- PacketProcessor -->
<g class="actor">
<line x1="920" y1="40" x2="920" y2="820" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="880" y="20" width="80" height="32" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
<text x="920" y="42" fill="var(--ink)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PacketProcessor</text>
<text x="920" y="56" class="type">DOMAIN</text>
</g>

<!-- Messages -->
<g font-family="'Geist Mono', monospace" font-size="8">
<!-- 1. User clicks Connect -->
<line x1="80" y1="80" x2="200" y2="80" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="72" class="msg-label">点击连接按钮</text>

<!-- 2. MainActivity -> MainViewModel.connect() -->
<line x1="200" y1="110" x2="320" y2="110" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="102" class="msg-label">connect(serverId)</text>

<!-- 3. MainViewModel -> check VPN permission -->
<line x1="320" y1="140" x2="200" y2="140" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="132" class="return-label">VpnService.prepare()</text>

<!-- 4. MainActivity requests VPN permission -->
<line x1="80" y1="170" x2="200" y2="170" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="140" y="162" class="async-label">请求 VPN 权限 (系统对话框)</text>

<!-- 5. User grants permission -->
<line x1="80" y1="200" x2="200" y2="200" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="192" class="msg-label">onActivityResult(granted)</text>

<!-- 6. MainActivity -> MainViewModel.onVpnPermissionGranted() -->
<line x1="200" y1="230" x2="320" y2="230" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="222" class="msg-label">onVpnPermissionGranted()</text>

<!-- 7. MainViewModel -> startForegroundService(SshVpnService) -->
<line x1="320" y1="260" x2="440" y2="260" stroke="var(--link)" stroke-width="1.5" marker-end="url(#arrow-async)" stroke-dasharray="4,3"/>
<text x="380" y="252" class="async-label">startForegroundService(Intent)</text>

<!-- 8. SshVpnService.onStartCommand() -->
<rect x="400" y="275" width="80" height="24" rx="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
<text x="440" y="293" fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">onStartCommand</text>

<!-- 9. SshVpnService -> establishVpnInterface() -->
<rect x="400" y="305" width="80" height="24" rx="4" fill="var(--ink)" stroke="var(--ink)" stroke-width="0.5"/>
<text x="440" y="322" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">建建 TUN</text>
<text x="440" y="334" fill="rgba(245,245,245,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.0.1/24 · fd00::1/64</text>
<text x="440" y="346" fill="rgba(245,245,245,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">DNS: 10.0.0.1 · MTU: 1500</text>

<!-- 10. SshVpnService -> VpnController.connect() -->
<line x1="440" y1="370" x2="560" y2="370" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="362" class="msg-label">connect(config, password)</text>

<!-- 11. VpnController -> sshChannelFactory.connect() -->
<line x1="560" y1="400" x2="680" y2="400" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="620" y="392" class="msg-label">connect(ServerConfig)</text>

<!-- 12. JschSshClient: JSch session -->
<rect x="640" y="415" width="80" height="48" rx="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="0.5"/>
<text x="680" y="433" fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">JSch 连接</text>
<text x="680" y="445" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">setKnownHosts(empty)</text>
<text x="680" y="457" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">setConfig(StrictHostKeyChecking=no)</text>

<!-- 13. JschSshClient: createJSchIdentity() -->
<line x1="680" y1="470" x2="800" y2="470" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-async)"/>
<text x="740" y="462" class="async-label">createJSchIdentity(keyAlias)</text>

<!-- 14. SshKeyManager: getIdentity() -->
<rect x="760" y="480" width="80" height="24" rx="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="0.5"/>
<text x="800" y="498" fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AndroidKeyStoreIdentity</text>

<!-- 15. JschSshClient: session.connect() -->
<rect x="640" y="510" width="80" height="24" rx="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="0.5"/>
<text x="680" y="528" fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">session.connect()</text>

<!-- 16. JschSshClient returns ConnectionResult -->
<line x1="680" y1="550" x2="560" y2="550" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="620" y="542" class="msg-label">ConnectionResult(success, port=1080)</text>

<!-- 17. VpnController -> socks5Proxy.start() -->
<line x1="560" y1="580" x2="800" y2="580" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="680" y="572" class="msg-label">start(1080, "127.0.0.1")</text>

<!-- 18. Socks5ProxyServer: bind & selector loop -->
<rect x="760" y="595" width="80" height="24" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="0.5"/>
<text x="800" y="613" fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ServerSocketChannel.bind()</text>
<text x="800" y="625" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Selector.select() 循环</text>

<!-- 19. VpnController -> packetProcessor.setDnsInterceptor() -->
<line x1="560" y1="640" x2="920" y2="640" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="632" class="msg-label">setDnsInterceptor()</text>

<!-- 20. VpnController -> packetProcessor.setTunWriter() -->
<line x1="560" y1="670" x2="920" y2="670" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="662" class="msg-label">setTunWriter(writeToTun)</text>

<!-- 21. VpnController -> updateState(Connected) -->
<line x1="560" y1="700" x2="440" y2="700" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="692" class="return-label">vpnState=Connected</text>

<!-- 22. VpnController -> SshVpnService callback -->
<line x1="440" y1="730" x2="320" y2="730" stroke="var(--link)" stroke-width="1.5" marker-end="url(#arrow-async)"/>
<text x="380" y="722" class="async-label">VPN 连接成功</text>

<!-- 23. MainViewModel -> MainActivity update UI -->
<line x1="320" y1="760" x2="200" y2="760" stroke="var(--link)" stroke-width="1.5" marker-end="url(#arrow-async)"/>
<text x="260" y="752" class="async-label">uiState.isConnected=true</text>

<!-- 24. MainActivity -> User: 显示连接成功 -->
<line x1="200" y1="790" x2="80" y2="790" stroke="var(--link)" stroke-width="1.5" marker-end="url(#arrow-async)"/>
<text x="140" y="782" class="async-label">显示"已连接"状态</text>

<!-- 25. VpnController starts packetLoop() -->
<rect x="520" y="805" width="80" height="24" rx="4" fill="#ffffff" stroke="var(--ink)" stroke-width="0.5"/>
<text x="560" y="823" fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">packetLoop() 启动</text>
<text x="560" y="835" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">while(isRunning) read TUN → processPacket()</text>
</g>

<!-- Activation bars (thin rectangles on lifelines) -->
<rect x="77" y="80" width="6" height="740" fill="var(--ink)" opacity="0.15" rx="3"/>
<rect x="197" y="80" width="6" height="740" fill="var(--ink)" opacity="0.15" rx="3"/>
<rect x="317" y="80" width="6" height="740" fill="var(--ink)" opacity="0.15" rx="3"/>
<rect x="437" y="80" width="6" height="740" fill="var(--accent)" opacity="0.15" rx="3"/>
<rect x="557" y="80" width="6" height="740" fill="var(--ink)" opacity="0.15" rx="3"/>
<rect x="677" y="80" width="6" height="740" fill="var(--accent)" opacity="0.15" rx="3"/>
<rect x="797" y="80" width="6" height="740" fill="var(--ink)" opacity="0.15" rx="3"/>
<rect x="917" y="80" width="6" height="740" fill="var(--ink)" opacity="0.15" rx="3"/>

<!-- Legend -->
<line x1="30" y1="850" x2="970" y2="850" stroke="var(--rule)" stroke-width="0.8"/>
<text x="30" y="866" class="return-label">LEGEND</text>
<line x1="140" y1="858" x2="155" y2="858" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="155" y="866" class="return-label">同步调用</text>
<line x1="250" y1="858" x2="265" y2="858" stroke="var(--link)" stroke-width="1.5" marker-end="url(#arrow-async)" stroke-dasharray="4,3"/>
<text x="265" y="866" class="return-label">异步/跨进程</text>
<line x1="380" y1="858" x2="395" y2="858" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="395" y="866" class="return-label">SSH 核心链路</text>
<line x1="500" y1="858" x2="515" y2="858" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="866" class="return-label">返回值</text>
<rect x="620" y="850" width="12" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
<text x="635" y="866" class="return-label">Service/关键节点</text>
</g>
</svg>
</div>
<footer>

</footer>
</body>
</html>
