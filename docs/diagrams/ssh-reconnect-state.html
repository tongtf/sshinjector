<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH 会话重连状态机</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f8f9ff; --ink:#191c20; --muted:#535f70; --soft:#73777f;
          --accent:#1565c0; --accent-tint:rgba(21,101,192,0.08); --rule:rgba(25,28,32,0.12); }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Roboto',sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:40px 32px 24px; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:12px; font-weight:500;
             letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:44px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 24px; }
  .fig { border:1px solid var(--rule); border-radius:8px; padding:16px; overflow-x:auto; }
  svg { display:block; }
  .foot { margin-top:16px; font-family:'Geist Mono',monospace; font-size:11px;
          color:var(--soft); border-top:1px solid var(--rule); padding-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">STATE MACHINE · SSH SESSION</p>
  <h1>SSH 会话池重连状态机</h1>
  <p class="sub">JschSshClient — 3 会话池 · keepAlive 每 30s · 线性退避重连 ≤5 次（JschSshClient.kt:414-470）</p>
  <div class="fig">
  <svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto',sans-serif">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#535f70"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
      </marker>
    </defs>

    <!-- arrows -->
    <path d="M 170,76 V 160" fill="none" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 260,188 H 400" fill="none" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 490,160 V 100 H 170 V 160" fill="none" stroke="#1565c0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 490,216 V 340" fill="none" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 130,160 C 130,120 90,120 90,140" fill="none" stroke="#73777f" stroke-width="1"/>

    <!-- labels -->
    <rect x="276" y="172" width="136" height="12" rx="2" fill="#f8f9ff"/>
    <text x="344" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">keepAlive 失败</text>
    <rect x="200" y="84" width="120" height="12" rx="2" fill="#f8f9ff"/>
    <text x="260" y="93" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">重连成功</text>
    <rect x="500" y="264" width="116" height="12" rx="2" fill="#f8f9ff"/>
    <text x="558" y="273" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">耗尽 5 次</text>
    <rect x="56" y="96" width="112" height="12" rx="2" fill="#f8f9ff"/>
    <text x="112" y="105" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">每 30s keepalive</text>

    <!-- nodes -->
    <circle cx="170" cy="48" r="6" fill="#191c20"/>
    <rect x="80" y="160" width="180" height="56" rx="8" fill="#f8f9ff"/>
    <rect x="80" y="160" width="180" height="56" rx="8" fill="rgba(21,101,192,0.08)" stroke="#1565c0" stroke-width="1"/>
    <text x="170" y="188" fill="#191c20" font-size="12" font-weight="600" text-anchor="middle">Connected</text>
    <text x="170" y="204" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">会话池 ×3 健康</text>

    <rect x="400" y="160" width="180" height="56" rx="8" fill="#f8f9ff"/>
    <rect x="400" y="160" width="180" height="56" rx="8" fill="#ffffff" stroke="#191c20" stroke-width="1"/>
    <text x="490" y="188" fill="#191c20" font-size="12" font-weight="600" text-anchor="middle">Reconnecting</text>
    <text x="490" y="204" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">退避 min(1s·n, 10s)</text>

    <rect x="400" y="340" width="180" height="56" rx="8" fill="#f8f9ff"/>
    <rect x="400" y="340" width="180" height="56" rx="8" fill="rgba(21,101,192,0.08)" stroke="#1565c0" stroke-width="1"/>
    <circle cx="490" cy="396" r="8" fill="none" stroke="#191c20" stroke-width="1.2"/>
    <circle cx="490" cy="396" r="5" fill="#191c20"/>
    <text x="490" y="368" fill="#191c20" font-size="12" font-weight="600" text-anchor="middle">Pool Failed</text>
    <text x="490" y="384" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">All SSH sessions lost</text>

    <!-- note -->
    <text x="80" y="424" fill="#73777f" font-size="11" font-family="'Geist Mono',monospace">
成功重连后原子替换池成员（pool.remove/add，JschSshClient:445-446），旧 session scope 一并取消（:451），keepAlive 重启。
池级判定：任一 session 健康即视为整体可用；全部丢失才进入 Failed。
Pool Failed → SshVpnService.observeJschConnectionState（:501）触发整体 autoReconnect（:590），带 10s 退避窗（POOL_FAIL_RECONNECT_BACKOFF_MS）防重连风暴。
    </text>

    <!-- legend -->
    <line x1="24" y1="472" x2="916" y2="472" stroke="rgba(25,28,32,0.10)" stroke-width="0.8"/>
    <text x="24" y="484" fill="#535f70" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="120" y1="478" x2="160" y2="478" stroke="#535f70" stroke-width="1.2"/>
    <text x="168" y="481" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">常规转移</text>
    <line x1="244" y1="478" x2="284" y2="478" stroke="#73777f" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="292" y="481" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">周期动作</text>
    <line x1="368" y1="478" x2="408" y2="478" stroke="#1565c0" stroke-width="1.2"/>
    <text x="416" y="481" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">成功路径</text>
  </svg>
  </div>
  <p class="foot">SSHInjector · SESSION_POOL_SIZE=3 · CHANNEL_WINDOW_SIZE=8MB · 独立于 VPN 网络切换重连</p>
</div>
</body>
</html>
