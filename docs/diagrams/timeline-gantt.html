<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发任务甘特图 · 并行/串行</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f8f9ff; --ink:#191c20; --muted:#535f70; --soft:#73777f;
          --accent:#1565c0; --accent-tint:rgba(21,101,192,0.08); --rule:rgba(25,28,32,0.12); }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Roboto',sans-serif; }
  .wrap { max-width:1240px; margin:0 auto; padding:40px 32px 24px; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:12px; font-weight:500;
             letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:44px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 24px; }
  .fig { border:1px solid var(--rule); border-radius:8px; padding:16px; overflow-x:auto; }
  svg { display:block; }
  .foot { margin-top:16px; font-family:'Geist Mono',monospace; font-size:11px;
          color:var(--soft); border-top:1px solid var(--rule); padding-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">GANTT · DEV TASKS</p>
  <h1>开发任务并行度</h1>

        <polygon points="0 0, 8 3, 0 6" fill="#535f70"/>

    </defs>

    <!-- time axis -->

    <text x="600" y="42" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">08-17 批2+3</text>
    <text x="900" y="42" fill="#7a8399" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">08-18 收尾</text>

    <line x1="900" y1="70" x2="900" y2="720" stroke="rgba(25,28,32,0.08)" stroke-width="1"/>

    <!-- lane backgrounds -->
    <rect x="160" y="90" width="1020" height="180" rx="6" fill="rgba(21,101,192,0.05)"/>
    <rect x="160" y="290" width="1020" height="180" rx="6" fill="rgba(0,137,123,0.05)"/>
    <rect x="160" y="490" width="1020" height="90" rx="6" fill="rgba(46,125,50,0.05)"/>
    <rect x="160" y="600" width="1020" height="110" rx="6" fill="rgba(230,81,0,0.05)"/>

    <!-- lane labels -->

    <text x="170" y="644" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">全程串行</text>

    <text x="395" y="121" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">背压</text>

    <text x="480" y="121" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">日志节流</text>
    <text x="520" y="122" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">∥ 4 项并行</text>

    <!-- sub-row B: serial return-path chain -->
    <rect x="200" y="220" width="110" height="24" rx="6" fill="#1976d2"/>
    <text x="255" y="236" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">SshIoDispatcher</text>
    <rect x="330" y="220" width="110" height="24" rx="6" fill="#1976d2"/>
    <text x="385" y="236" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">零拷贝回调</text>
    <rect x="460" y="220" width="110" height="24" rx="6" fill="#1976d2"/>
    <text x="515" y="236" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">流式校验和</text>
    <text x="300" y="182" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">回向路径链 · 串行</text>
    <path d="M 310,232 H 326" fill="none" stroke="#73777f" stroke-width="1" marker-end="url(#arrow-dash)"/>
    <path d="M 440,232 H 456" fill="none" stroke="#73777f" stroke-width="1" marker-end="url(#arrow-dash)"/>

    <text x="605" y="145" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">单测+ktlint/detekt/lint</text>
    <path d="M 605,159 V 290" fill="none" stroke="#73777f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>

    <!-- ── lane ② features ── -->
    <rect x="610" y="310" width="80" height="24" rx="6" fill="#00897b"/>
    <text x="650" y="326" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">SSH 联动</text>
    <rect x="700" y="310" width="90" height="24" rx="6" fill="#00897b"/>
    <text x="745" y="326" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">全局设置</text>

    <text x="890" y="326" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">∥ 并行</text>

    <rect x="610" y="420" width="70" height="24" rx="6" fill="#00a08f"/>
    <text x="645" y="436" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">UDP降级</text>

    <rect x="780" y="420" width="80" height="24" rx="6" fill="#00a08f"/>
    <text x="820" y="436" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">IPv6 ND</text>
    <text x="870" y="436" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">∥ 并行</text>
    <text x="300" y="380" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">泳道② 内部 6 项均相互独立 · 可并行</text>

    <!-- ── lane ③ UI/cleanup ── -->
    <rect x="610" y="510" width="80" height="24" rx="6" fill="#2e7d32"/>
    <text x="650" y="526" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">关于页</text>
    <text x="700" y="526" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">∥ 与泳道② 并行</text>
    <rect x="840" y="510" width="100" height="24" rx="6" fill="#388e3c"/>
    <text x="890" y="526" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">死代码清理</text>
    <text x="920" y="566" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">依赖 UDP 降级完成</text>
    <path d="M 760,444 V 528 H 836" fill="none" stroke="#73777f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>

    <!-- ── lane ④ verify/release ── -->
    <rect x="200" y="620" width="70" height="24" rx="6" fill="#e65100"/>
    <text x="235" y="636" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">单测</text>
    <rect x="280" y="620" width="90" height="24" rx="6" fill="#e65100"/>
    <text x="325" y="636" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">质量门×3</text>
    <rect x="610" y="620" width="70" height="24" rx="6" fill="#e65100"/>
    <text x="645" y="636" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">审计</text>
    <rect x="900" y="620" width="90" height="24" rx="6" fill="#e65100"/>
    <text x="945" y="636" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">ABI 打包</text>

    <!-- cross-lane gates -->
    <!-- legend -->

    <rect x="120" y="736" width="14" height="10" rx="2" fill="#1565c0"/>
    <text x="142" y="745" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">批1 性能</text>
    <rect x="220" y="736" width="14" height="10" rx="2" fill="#00897b"/>
    <text x="242" y="745" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">批2 功能</text>
    <rect x="320" y="736" width="14" height="10" rx="2" fill="#2e7d32"/>
    <text x="342" y="745" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">UI/清理</text>
    <rect x="420" y="736" width="14" height="10" rx="2" fill="#e65100"/>
    <text x="442" y="745" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">验证/发布</text>
    <line x1="530" y1="740" x2="560" y2="740" stroke="#73777f" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="568" y="745" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">串行依赖 / 门禁</text>
    <text x="700" y="745" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace">∥ = 并行任务</text>
  </svg>
  </div>

</div>
</body>
</html>
