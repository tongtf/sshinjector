<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNS 解析时序</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f8f9ff; --ink:#191c20; --muted:#535f70; --soft:#73777f;
          --accent:#1565c0; --accent-tint:rgba(21,101,192,0.08); --rule:rgba(25,28,32,0.12); }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Roboto',sans-serif; }
  .wrap { max-width:1060px; margin:0 auto; padding:40px 32px 24px; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:12px; font-weight:500;
             letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:44px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 24px; }
  .fig { border:1px solid var(--rule); border-radius:8px; padding:16px; overflow-x:auto; }
  svg { display:block; }
  .foot { margin-top:16px; font-family:'Geist Mono',monospace; font-size:11px;
          color:var(--soft); border-top:1px solid var(--rule); padding-top:12px; }
  .msg { font-family:'Geist Mono',monospace; font-size:10px; fill:#191c20; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">SEQUENCE · DNS RESOLVE</p>
  <h1>DNS 解析时序</h1>
  <p class="sub">REMOTE 假 IP 模式 vs SYSTEM 系统直连模式（DnsInterceptor.kt:441-424 · VpnController.dnsResponseDeliveryLoop）</p>
  <div class="fig">
  <svg viewBox="0 0 1060 580" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto',sans-serif">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#535f70"/>
      </marker>
      <marker id="arrow-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#73777f"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
      </marker>
    </defs>

    <!-- lifelines -->
    <line x1="140" y1="72" x2="140" y2="500" stroke="rgba(25,28,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="440" y1="72" x2="440" y2="500" stroke="rgba(25,28,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="700" y1="72" x2="700" y2="500" stroke="rgba(25,28,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="960" y1="72" x2="960" y2="500" stroke="rgba(25,28,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- activation bars -->
    <rect x="436" y="96" width="8" height="120" fill="rgba(25,28,32,0.06)" stroke="#535f70" stroke-width="0.8"/>
    <rect x="696" y="176" width="8" height="40" fill="rgba(25,28,32,0.06)" stroke="#535f70" stroke-width="0.8"/>
    <rect x="436" y="272" width="8" height="160" fill="rgba(25,28,32,0.06)" stroke="#535f70" stroke-width="0.8"/>
    <rect x="696" y="432" width="8" height="40" fill="rgba(25,28,32,0.06)" stroke="#535f70" stroke-width="0.8"/>

    <!-- actors -->
    <rect x="68" y="40" width="144" height="32" rx="6" fill="#f8f9ff"/>
    <rect x="68" y="40" width="144" height="32" rx="6" fill="#ffffff" stroke="#191c20" stroke-width="1"/>
    <text x="140" y="60" fill="#191c20" font-size="11" font-weight="600" text-anchor="middle">App · TUN</text>
    <rect x="368" y="40" width="144" height="32" rx="6" fill="#f8f9ff"/>
    <rect x="368" y="40" width="144" height="32" rx="6" fill="rgba(21,101,192,0.08)" stroke="#1565c0" stroke-width="1"/>
    <text x="440" y="60" fill="#191c20" font-size="11" font-weight="600" text-anchor="middle">DnsInterceptor</text>
    <rect x="628" y="40" width="144" height="32" rx="6" fill="#f8f9ff"/>
    <rect x="628" y="40" width="144" height="32" rx="6" fill="#ffffff" stroke="#191c20" stroke-width="1"/>
    <text x="700" y="60" fill="#191c20" font-size="11" font-weight="600" text-anchor="middle">Delivery Loop</text>
    <rect x="888" y="40" width="144" height="32" rx="6" fill="#f8f9ff"/>
    <rect x="888" y="40" width="144" height="32" rx="6" fill="rgba(25,28,32,0.03)" stroke="rgba(25,28,32,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="960" y="60" fill="#191c20" font-size="11" font-weight="600" text-anchor="middle">系统 DNS · protect</text>

    <!-- REMOTE mode -->
    <line x1="140" y1="96" x2="436" y2="96" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="210" y="90" class="msg">DNS 查询 (UDP:53)</text>
    <path d="M 444,136 H 436" fill="none" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="456" y="140" class="msg">缓存 miss · 分配假 IP 198.18.x / fd00::x</text>
    <line x1="440" y1="176" x2="696" y2="176" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="516" y="170" class="msg">pendingResponses.trySend</text>
    <line x1="700" y1="216" x2="144" y2="216" stroke="#1565c0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="216" y="210" class="msg">假响应写 TUN（TTL 300s）</text>

    <!-- SYSTEM mode -->
    <line x1="140" y1="272" x2="436" y2="272" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="210" y="266" class="msg">DNS 查询（未命中列表）</text>
    <line x1="440" y1="312" x2="956" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="580" y="306" class="msg">protect socket · 绕过 VPN 直发</text>
    <line x1="960" y1="352" x2="444" y2="352" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="600" y="346" class="msg">真实响应（5s 超时）</text>
    <path d="M 444,392 H 436" fill="none" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="456" y="396" class="msg">恢复查询 ID · 缓存 · 建 ipToDomain</text>
    <line x1="440" y1="432" x2="696" y2="432" stroke="#535f70" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="516" y="426" class="msg">pendingResponses.trySend</text>
    <line x1="700" y1="472" x2="144" y2="472" stroke="#1565c0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="216" y="466" class="msg">真实响应写 TUN</text>

    <!-- legend -->
    <line x1="24" y1="536" x2="1036" y2="536" stroke="rgba(25,28,32,0.10)" stroke-width="0.8"/>
    <text x="24" y="548" fill="#535f70" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="120" y1="542" x2="160" y2="542" stroke="#535f70" stroke-width="1.2"/>
    <text x="168" y="545" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">内部调用</text>
    <line x1="244" y1="542" x2="284" y2="542" stroke="#2e5aa8" stroke-width="1.2"/>
    <text x="292" y="545" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">网络</text>
    <line x1="352" y1="542" x2="392" y2="542" stroke="#1565c0" stroke-width="1.2"/>
    <text x="400" y="545" fill="#73777f" font-size="9" font-family="'Geist Mono',monospace">TUN 交付</text>
  </svg>
  </div>
  <p class="foot">SSHInjector · DOMAIN_SPLIT：命中列表走 REMOTE 假 IP，未命中走 SYSTEM；deliveryLoop 挂起于 Channel receiveCatching</p>
</div>
</body>
</html>
